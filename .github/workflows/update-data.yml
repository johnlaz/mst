name: Update market data

on:
  schedule:
    # Three attempts per weekday evening. GitHub sometimes delays or skips a scheduled run,
    # so the later ones act as backups. If nothing changed, a run commits nothing.
    - cron: "30 22 * * 1-5"   # 5:30 PM EST / 6:30 PM EDT, after the US close
    - cron: "30 23 * * 1-5"   # backup, one hour later
    - cron: "15 1 * * 2-6"    # backup, evening catch-up (still the same trading day in the US)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Build data/market.json
        run: python scripts/update_data.py
        env:
          # Optional. Only used if Yahoo and Stooq both fail for the three index ETFs.
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          [ -f data/stocks.json ] && git add data/stocks.json || true
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "Update market data"
            # If you pushed a change while this was running, sit on top of it instead of failing.
            git pull --rebase origin main
            git push
          fi
